<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ctext x=%2232%22 y=%2249%22 font-size=%2252%22 text-anchor=%22middle%22%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head><body>
<title>Malkiaa Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style id="app-css">
/* Layout concept: fixed pastel sidebar, card-grid dashboard in the middle, original mascot peeking up from behind the dashboard on the right. Creator mode adds a peach management layer on the same visual identity. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --primary:#D7E9FF; --powder:#F4F8FF;
  --peach:#FFF0B8; --cyan:#B9D8F7; --ink:#3F4D61; --muted:#718096;
  --line:rgba(63,77,97,.12); --shadow:0 10px 30px -12px rgba(133,173,214,.28);
  --on-accent:#30445D; --side:#FFFFFF; --ok:#4B9B78; --warn:#B98A32; --bad:#C45C70; color-scheme:light;
  --font-display:'Fredoka','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#FFFFFF; --card:#FFFFFF; --primary:#D7E9FF; --powder:#F4F8FF; --peach:#FFF0B8; --cyan:#B9D8F7; --ink:#3F4D61; --muted:#718096; --line:rgba(63,77,97,.12); --shadow:0 10px 30px -12px rgba(133,173,214,.28); --side:#FFFFFF; --on-accent:#30445D; --ok:#4B9B78; --warn:#B98A32; --bad:#C45C70; color-scheme:light;
  }
}
:root[data-theme="dark"]{
  --bg:#FFFFFF; --card:#FFFFFF; --primary:#D7E9FF; --powder:#F4F8FF; --peach:#FFF0B8; --cyan:#B9D8F7; --ink:#3F4D61; --muted:#718096; --line:rgba(63,77,97,.12); --shadow:0 10px 30px -12px rgba(133,173,214,.28); --side:#FFFFFF; --on-accent:#30445D; --ok:#4B9B78; --warn:#B98A32; --bad:#C45C70; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;overflow-x:hidden}
body{background-image:radial-gradient(circle at 12% 8%,var(--powder) 0,transparent 38%),radial-gradient(circle at 88% 92%,var(--powder) 0,transparent 34%);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:12px}
svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- Pekora-inspired layout ---- */
.shell{min-height:100vh;display:flex;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:28px 14px 20px;padding-left:max(14px,env(safe-area-inset-left,0px));z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 20px;border-bottom:1px solid var(--line);margin-bottom:8px}
.avatar{width:46px;height:46px;border-radius:50%;border:3px solid var(--card);box-shadow:var(--shadow);overflow:hidden;background:var(--primary);display:grid;place-items:center;user-select:none;-webkit-user-select:none;cursor:pointer;transition:transform .2s;flex:none}
.avatar:hover{transform:scale(1.04)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.brand h1{font-size:1.1rem;line-height:1.1}
.brand p{color:var(--muted);font-size:.72rem;font-weight:700;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:10px 12px;border-radius:14px;cursor:pointer;font-weight:700;font-size:.88rem;text-align:left;transition:background .2s,color .2s;color:var(--muted)}
.nav button:hover{background:var(--card);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--cyan);color:var(--on-accent);box-shadow:0 4px 12px -6px var(--cyan)}
.nav button.creator-link{color:color-mix(in srgb,var(--peach) 80%,var(--ink))}
.nav button.creator-link[aria-current="page"]{background:var(--peach);color:#1E3640}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.status-mini{background:var(--card);border-radius:16px;padding:10px 12px;border:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:.8rem}
.status-mini b{display:block;font-size:.85rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent);animation:pulse 2s infinite}
.dot.limited{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.dot.closed{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 25%,transparent);animation:none}
@keyframes pulse{50%{opacity:.55}}
.socials{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap;padding:0 4px}
.soc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s,background .2s;text-decoration:none}
.soc:hover:not(:disabled){transform:translateY(-2px);background:var(--peach);color:#1E3640}
.soc:disabled{opacity:.45;cursor:not-allowed}

/* ---- main area ---- */
.main{margin-left:220px;flex:1;min-width:0;padding:0;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-left{display:flex;flex-direction:column;gap:1px;min-width:0}
.crumb{font-size:.7rem;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}
.greet{font-size:1.1rem;line-height:1.2;font-family:var(--font-display);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;width:220px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:.85rem;color:inherit;width:100%;min-width:0}
.search:focus-within{border-color:var(--cyan)}
/* page tabs – Pekora style */
.quick{display:flex;gap:6px;align-items:center;margin-left:auto}
.quick-tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.quick-tab:hover{background:var(--powder);color:var(--ink)}
.quick-tab[aria-pressed="true"]{background:var(--peach);color:#1E3640}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer;transition:background .2s,transform .2s}
.chip:hover{background:var(--powder);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--cyan);color:var(--on-accent);border-color:transparent}
/* inner content wrapper */
.main-inner{padding:22px 24px 56px;flex:1}

.page{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);min-width:0;transition:transform .25s,box-shadow .25s;position:relative}
.card.lift:hover{transform:translateY(-4px)}
.card h2{font-size:1.25rem}
.card h3{font-size:1.1rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.muted{color:var(--muted)}
.tint{background:linear-gradient(145deg,var(--primary),var(--powder));border-color:transparent}
:root:not([data-theme="dark"]) .tint .muted{color:#4B5A66}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-12{grid-column:span 12}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}
.row-2{grid-row:span 2}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;font-size:.92rem}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.peach{background:var(--peach);color:#1E3640;box-shadow:0 8px 18px -10px var(--peach)}
.btn.cyan{background:var(--cyan);color:var(--on-accent)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;background:var(--powder)}
.pill.open{color:var(--ok)}.pill.limited{color:var(--warn)}.pill.closed{color:var(--bad)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--powder);padding:3px 10px;border-radius:999px}

.art{position:relative;border-radius:20px;overflow:hidden;background:var(--powder);aspect-ratio:4/5;width:100%}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.art.wide{aspect-ratio:16/11}.art.sq{aspect-ratio:1}
button.art{border:0;padding:0;cursor:zoom-in;display:block}
button.art:hover img{transform:scale(1.05)}
.feat{display:flex;flex-direction:column;gap:14px;height:100%}
.feat .art{flex:1;min-height:200px;aspect-ratio:auto}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.strip>*{scroll-snap-align:start}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.svc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--powder);border:0;border-radius:22px;padding:16px;cursor:pointer;transition:transform .2s,background .2s}
.svc:hover{transform:translateY(-4px) rotate(-1deg);background:var(--primary)}
.svc .ico{width:40px;height:40px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--cyan)}
.ico-box{width:40px;height:40px;border-radius:14px;background:var(--powder);display:grid;place-items:center;color:var(--cyan);flex:none}
.svc small{color:var(--muted);line-height:1.35}
.kv{display:flex;flex-direction:column;gap:2px}
.kv-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.kv-row:last-child{border:0}
.kv-row .ic{color:var(--cyan);margin-top:3px}
.kv-row span{display:block;font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.mascot{display:none}
.m-inline{display:none}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:18px}
.gal-item{display:flex;flex-direction:column;gap:8px;text-align:left}
.gal-item .cap{padding:0 4px}
.gal-item b{display:block;line-height:1.25}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(20,35,45,.72);z-index:100;display:grid;place-items:center;padding:16px;animation:enter .2s ease both;backdrop-filter:blur(4px)}
.modal-box{background:var(--card);border-radius:32px;max-width:980px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);position:relative;animation:pop .32s cubic-bezier(.2,.9,.3,1.2) both}
.modal-box .art{border-radius:0;aspect-ratio:auto;height:100%;min-height:320px;background:var(--powder)}
.modal-box .art img{object-fit:contain}
.modal-info{padding:28px;display:flex;flex-direction:column;gap:12px}
.xbtn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);z-index:2}
.nbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}}
.access{display:block;max-width:440px;padding:30px;text-align:center}
.access .lockico{width:64px;height:64px;border-radius:22px;background:var(--powder);color:var(--cyan);display:grid;place-items:center;margin:0 auto 14px;font-size:1.6rem}
.access.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pwrow{display:flex;gap:8px;margin:18px 0 6px}
.err{color:var(--bad);font-weight:700;font-size:.88rem;min-height:1.3em;margin-bottom:8px}

.price-group{margin-bottom:30px}
.price-group>h2{margin-bottom:4px}
.price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:14px}
.price{display:flex;flex-direction:column;gap:10px}
.price .amt{font-family:var(--font-display);font-size:1.7rem;line-height:1;overflow-wrap:anywhere}
.price .amt.na{font-size:1.05rem;color:var(--muted);font-family:var(--font-body);font-weight:700}
.seg{display:inline-flex;background:var(--powder);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--on-accent)}

.terms{display:flex;flex-direction:column;gap:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.step{display:flex;flex-direction:column;gap:8px}
.step .n{width:44px;height:44px;border-radius:16px;background:var(--peach);color:#1E3640;display:grid;place-items:center;font-family:var(--font-display);font-size:1.3rem}
.stages{display:flex;gap:0;flex-wrap:wrap;margin-top:12px}
.stage{flex:1 1 170px;padding:16px;background:var(--powder);position:relative;display:flex;flex-direction:column;gap:6px}
.stage:first-child{border-radius:22px 0 0 22px}.stage:last-child{border-radius:0 22px 22px 0}
.stage:not(:last-child){border-right:3px solid var(--card)}
.stage:nth-child(even){background:var(--primary)}
:root:not([data-theme="dark"]) .stage:nth-child(even) .muted{color:#4B5A66}

/* creator layer */
.cbar{position:sticky;top:10px;z-index:35;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(100deg,var(--peach),color-mix(in srgb,var(--peach) 55%,var(--primary)));color:#1E3640;border-radius:999px;padding:8px 10px 8px 18px;margin-bottom:18px;box-shadow:0 12px 26px -14px var(--peach)}
.cbar b{font-family:var(--font-display);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.cbar .btn.ghost{color:var(--ink)}
.cbar .unsaved{font-size:.8rem;font-weight:800;background:#1E3640;color:#fff;border-radius:999px;padding:3px 10px}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:8px}
.ctabs .chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ctabs .chip[aria-pressed="true"]{background:var(--peach);color:#1E3640}
.panel{display:flex;flex-direction:column;gap:18px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:2rem;line-height:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.lbl{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted)}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:10px 14px;font:inherit}
.in:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 30%,transparent)}
textarea.in{min-height:96px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.rowi{display:flex;gap:12px;align-items:center;padding:10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);min-width:0}
.rowi .thumb{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none;background:var(--powder)}
.rowi .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rowi .grow{flex:1;min-width:0}
.rowi .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.list{display:flex;flex-direction:column;gap:10px}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.ib:hover:not(:disabled){background:var(--peach);color:#1E3640}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib.on{background:var(--peach);color:#1E3640}
.ib.bad:hover:not(:disabled){background:var(--bad);color:#fff}
.imgpick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgpick .pv{width:84px;height:84px;border-radius:20px;overflow:hidden;background:var(--powder);display:grid;place-items:center;flex:none;color:var(--muted)}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.switch.full,.field.full .switch{grid-column:1/-1}
.switch input{width:22px;height:22px;accent-color:var(--cyan)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.note{padding:12px 16px;border-radius:18px;font-weight:700;font-size:.9rem}
.note.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.note.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.note.info{background:var(--powder)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--powder);border-radius:999px;padding:5px 6px 5px 12px;font-weight:700;font-size:.85rem}
.chipx button{border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:50%;width:22px;height:22px}
.chipx button:hover{background:var(--peach);color:#1E3640}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;animation:enter .25s ease both;max-width:calc(100vw - 32px)}
.review-window{overflow:hidden;position:relative;width:100%;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.review-track{display:flex;gap:14px;width:max-content;animation:review-drift 58s linear infinite}
.review-window:hover .review-track{animation-play-state:paused}
.review-card{width:min(340px,78vw);flex:none;background:var(--powder);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;white-space:normal}
.review-stars{color:#D6A23B;letter-spacing:2px;font-size:1rem}
.review-card p{overflow-wrap:anywhere}
@keyframes review-drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.review-track{animation:none}.review-window{overflow-x:auto;mask-image:none}}

.mbar,.bnav{display:none}
.drawer-back{position:fixed;inset:0;background:rgba(20,35,45,.55);z-index:60}

function useHashRoute() {
  const read = () => { const h = (window.location.hash || "").replace("#", ""); return ROUTES.includes(h) || /^(service|order)-[A-Za-z0-9_-]+$/.test(h) ? h : "home"; };
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const on = () => { setRoute(read()); window.scrollTo({ top: 0 }); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  const go = useCallback((id) => {
    try { window.location.hash = id === "home" ? "home" : id; } catch (e) {}
    setRoute(id); window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);
  return [route, go];
}
function useDouble(single, dbl, delay = 450) {
  const t = useRef(null), fns = useRef({});
  fns.current = { single, dbl };
  return useCallback(() => {
    if (t.current) { clearTimeout(t.current); t.current = null; fns.current.dbl(); }
    else t.current = setTimeout(() => { t.current = null; fns.current.single(); }, delay);
  }, [delay]);
}

/* ============================================================ creator access modal */
function AccessModal({ onClose, onSuccess }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [err, setErr] = useState("");
  const [shake, setShake] = useState(false);
  const [busy, setBusy] = useState(false);
  const [fails, setFails] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const inRef = useRef(null);
  useEffect(() => { inRef.current && inRef.current.focus(); const k = (e) => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [onClose]);
  const submit = async (e) => {
    e.preventDefault();
    if (busy) return;
    if (Date.now() < lockUntil) { setErr("Too many attempts. Please wait a moment."); return; }
    setBusy(true);
    const res = await onSuccess(email, pw);
    if (res) {
      const n = fails + 1; setFails(n);
      if (n >= 5) { setLockUntil(Date.now() + 30000); setFails(0); }
      setErr(res); setShake(true); setTimeout(() => setShake(false), 500); setPw("");
    }
    setBusy(false);
  };
  return (
    <div className="modal" onClick={onClose} role="dialog" aria-modal="true" aria-labelledby="gate-title">
      <form className={"modal-box access" + (shake ? " shake" : "")} onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div className="lockico"><Icon name="lock" /></div>
        <h2 id="gate-title" style={{ fontSize: "1.6rem" }}>Welcome Back, Creator.</h2>
        <p className="muted" style={{ marginTop: 6 }}>This area is exclusively for the owner of Malkiaa Studio.</p>
        <input ref={inRef} className="in" type="email" autoComplete="username" value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }} placeholder="Email" aria-label="Email" style={{ marginTop: 14 }} />
        <div className="pwrow">
          <input className="in" type={show ? "text" : "password"} autoComplete="current-password" value={pw} onChange={(e) => { setPw(e.target.value); setErr(""); }} placeholder="Password" aria-label="Password" />
          <button type="button" className="ib" style={{ width: 44, height: 44 }} onClick={() => setShow((v) => !v)} aria-label={show ? "Hide password" : "Show password"}><Icon name={show ? "eyeoff" : "eye"} /></button>
        </div>
        <div className="err" role="alert">{err}</div>
        <div className="btns" style={{ justifyContent: "center" }}>
          <Btn type="submit" disabled={busy || !email || !pw}>{busy ? "Signing in..." : "Enter Creator Mode"}</Btn>
          <Btn kind="ghost" onClick={onClose}>Cancel</Btn>
        </div>
      </form>
    </div>
  );
}

  const [busy, setBusy] = useState(false);

  const pick = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    setBusy(true); setErr("");
    try { onChange(await storeImage(f, maxDim)); } catch (x) { setErr(x.message === "type" ? "Use a PNG, JPG, WebP or GIF image." : "Could not upload this image."); }

  const src = safeImg(value);

    <div className="field full">

function ConfirmDelete({ onYes, label = "Delete" }) {
  const [ask, setAsk] = useState(false);
  return ask
    ? <><Btn kind="danger" size="sm" onClick={onYes}>Yes, delete</Btn><Btn kind="ghost" size="sm" onClick={() => setAsk(false)}>Cancel</Btn></>
    : <button className="ib bad" onClick={() => setAsk(true)} title={label} aria-label={label}><Icon name="trash" /></button>;
}
function ChipEditor({ label, items, onChange, placeholder }) {
  const [v, setV] = useState("");
  const add = () => { const t = v.trim(); if (t && !items.includes(t)) onChange(items.concat([t])); setV(""); };
  return (
    <div className="field full">
      <span>{label}</span>
      <div className="chips">{items.map((t, i) => <span key={t + i} className="chipx">{t}<button onClick={() => onChange(items.filter((_, j) => j !== i))} aria-label={"Remove " + t}><Icon name="x" /></button></span>)}</div>
      <div className="pwrow" style={{ margin: 0 }}>
        <input className="in" value={v} onChange={(e) => setV(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }} placeholder={placeholder} />
        <Btn kind="cyan" size="sm" icon="plus" onClick={add}>Add</Btn>
      </div>
    </div>
  );
}

function GalleryPanel() {
  const { site, upd } = useCreator();
  const [editing, setEditing] = useState(null);
  const [newCat, setNewCat] = useState("");
  const blank = () => ({ id: uid("a"), title: "", category: (site.categories[0] || {}).id || "", year: "", image: "", description: "", tools: "", notes: "" });
  const apply = (a) => {
    upd((n) => {
      const i = n.artworks.findIndex((x) => x.id === a.id);
      if (i >= 0) n.artworks[i] = a; else n.artworks.unshift(a);
    });
    setEditing(null);
  };
  const del = (id) => upd((n) => { n.artworks = n.artworks.filter((a) => a.id !== id); if (n.featuredId === id) n.featuredId = (n.artworks[0] || {}).id || ""; });
  const addCat = () => { const t = newCat.trim(); if (!t) return; upd((n) => { n.categories.push({ id: uid("c"), label: t }); }); setNewCat(""); };
  return (
    <div className="panel">
      {editing
        ? <ArtworkEditor key={editing.art.id} initial={editing.art} isNew={editing.isNew} onCancel={() => setEditing(null)} onApply={apply} />
        : <section className="card">
            <div className="card-head"><h2>Artworks ({site.artworks.length})</h2><Btn size="sm" icon="plus" onClick={() => setEditing({ art: blank(), isNew: true })}>Add artwork</Btn></div>
            <p className="muted" style={{ marginBottom: 12, fontSize: ".88rem" }}>Order here is the gallery order. The first 8 appear in Latest Works.</p>
            <div className="list">
              {site.artworks.map((a, i) => (
                <div key={a.id} className="rowi">
                  <div className="thumb"><img src={artSrc(a, i)} alt="" /></div>
                  <div className="grow"><b>{a.title}</b><span className="muted" style={{ fontSize: ".8rem" }}>{catLabel(a.category)}{a.year ? " · " + a.year : ""}</span></div>
                  <div className="acts">
                    <button className={"ib" + (site.featuredId === a.id ? " on" : "")} onClick={() => upd((n) => { n.featuredId = a.id; })} title="Set as featured" aria-label="Set as featured" aria-pressed={site.featuredId === a.id}><Icon name="star" /></button>
                    <button className="ib" disabled={i === 0} onClick={() => upd((n) => { n.artworks = move(n.artworks, i, -1); })} aria-label="Move up"><Icon name="up" /></button>
                    <button className="ib" disabled={i === site.artworks.length - 1} onClick={() => upd((n) => { n.artworks = move(n.artworks, i, 1); })} aria-label="Move down"><Icon name="down" /></button>
                    <button className="ib" onClick={() => setEditing({ art: clone(a), isNew: false })} aria-label="Edit"><Icon name="pen" /></button>
                    <ConfirmDelete onYes={() => del(a.id)} label="Delete artwork" />
                  </div>
                </div>
              ))}
              {!site.artworks.length && <p className="muted">No artwork yet. Add your first piece.</p>}
            </div>
          </section>}
      <section className="card">
        <h2 style={{ marginBottom: 12 }}>Categories</h2>
        <div className="list">
          {site.categories.map((c, i) => {
            const used = site.artworks.filter((a) => a.category === c.id).length;
            return (
              <div key={c.id} className="rowi">
                <input className="in" value={c.label} onChange={(e) => upd((n) => { n.categories[i].label = e.target.value; })} aria-label="Category name" />

              </div>
            );

        <div className="pwrow"><input className="in" value={newCat} onChange={(e) => setNewCat(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addCat(); }} placeholder="New category name" /><Btn kind="cyan" size="sm" icon="plus" onClick={addCat}>Add</Btn></div>

function SupabaseDbPanel() {
  const [cfg, setCfg] = useState(() => getSbCfg() || { url: "", anonKey: "" });
  const [status, refreshStatus] = useConnectionStatus();
  const [msg, setMsg] = useState("");
  const [testing, setTesting] = useState(false);
  const statusColor = { connected: "var(--ok)", unconfigured: "var(--muted)", connecting: "var(--warn)", error: "var(--bad)" };
  const statusLabel = { connected: "✓ Connected", unconfigured: "○ Not configured", connecting: "… Connecting", error: "✗ Connection error" };
  const test = async () => {
    if (!cfg.url || !cfg.anonKey) { setMsg("Please enter both the Project URL and Anon Key."); return; }
    setTesting(true); setMsg(""); _sbClient = null; Store._sb = null;
    setSbCfg(cfg);
    await loadSupabaseClient();
    refreshStatus();
    setTesting(false);
    if (_sbStatus === "connected") setMsg("Connected! Commission requests will now be saved to Supabase.");
    else setMsg("Connection failed. Check your URL and Anon Key, and make sure the required tables exist.");
  };
  const disconnect = () => {
    clearSbCfg(); _sbClient = null; Store._sb = null; _sbStatus = "unconfigured"; refreshStatus();
    setCfg({ url: "", anonKey: "" }); setMsg("Disconnected. Requests will be saved locally only.");
  };
  return (
    <div className="panel">
      <section className="card">
        <div className="card-head">
          <h2>Supabase Connection</h2>
          <span style={{ fontWeight: 800, fontSize: ".85rem", color: statusColor[status] || "var(--muted)" }}>{statusLabel[status] || status}</span>
        </div>
        <p className="muted" style={{ marginBottom: 16 }}>Connect to Supabase so commission requests are stored in the cloud and visible across all devices. Use your <b>anon / public</b> key only — never the service_role key.</p>
        <div className="form">
          <div className="field full"><span>Supabase Project URL</span><input className="in" value={cfg.url} onChange={(e) => setCfg({ ...cfg, url: e.target.value.trim() })} placeholder="https://xxxxxxxxxxxx.supabase.co" /></div>
          <div className="field full"><span>Anon / Publishable Key</span><input className="in" value={cfg.anonKey} onChange={(e) => setCfg({ ...cfg, anonKey: e.target.value.trim() })} placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…" type="password" /><small className="muted">Found in Supabase Dashboard → Project Settings → API → anon / public key.</small></div>
        </div>
        <div className="btns" style={{ marginTop: 14 }}>
          <Btn disabled={testing} onClick={test}>{testing ? "Testing…" : "Save & Test Connection"}</Btn>
          {status === "connected" && <Btn kind="danger" size="sm" onClick={disconnect}>Disconnect</Btn>}
        </div>
        {msg && <div className={"note " + (_sbStatus === "connected" ? "ok" : "bad")} style={{ marginTop: 12 }}>{msg}</div>}

      </section>
    </div>
  );
}

      try {
        const sb = await Store.client();
        if (!sb) return;
        const { data, error } = await sb.from("app_settings")
          .select("value").eq("key", "email_config").maybeSingle();
        if (error) throw error;
        if (active && data?.value) {
          const next = { ...defaultCfg, ...data.value };
          setCfg(next);
          setEmailCfgLocal(next);
        }

  try { localStorage.setItem(SB_CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
}
function clearSbCfg() {
  try { localStorage.removeItem(SB_CFG_KEY); } catch (e) {}
}

async function loadSupabaseClient() {
  const cfg = getSbCfg();
  if (!cfg || !cfg.url || !cfg.anonKey) { _sbStatus = "unconfigured"; _sbClient = null; return null; }
  if (_sbClient) return _sbClient;
  _sbStatus = "connecting";
  try {
    // Load Supabase JS from CDN if not already loaded
    if (!window.supabase) {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    _sbClient = window.supabase.createClient(cfg.url, cfg.anonKey, {
      auth: { persistSession: true, autoRefreshToken: true },
    });
    // Test the connection with a lightweight ping
    const { error } = await _sbClient.from("commission_requests").select("id").limit(1);
    if (error && error.code !== "PGRST116" && error.code !== "42501") {
      // 42501 = RLS denied (expected for anon), PGRST116 = no rows (fine)
      // Any other error likely means wrong URL/key or network
      console.warn("Supabase ping error:", error);
    }
    _sbStatus = "connected";
    return _sbClient;
  } catch (e) {
    _sbStatus = "error";
    _sbClient = null;
    console.error("Supabase load error:", e);
    return null;
  }
}

// Upload a file blob to Supabase Storage and return public URL
async function sbUploadFile(sb, bucket, path, file) {
  const { data, error } = await sb.storage.from(bucket).upload(path, file, { upsert: false, contentType: file.type });
  if (error) throw new Error("Storage upload failed: " + error.message);
  const { data: { publicUrl } } = sb.storage.from(bucket).getPublicUrl(data.path);
  return { path: data.path, url: publicUrl };
}

/* ---- Store: Supabase-first, no localStorage fallback for new submissions ---- */
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

const Store = {
  _sb: null,
  async client() {
    if (this._sb) return this._sb;
    this._sb = await loadSupabaseClient();
    return this._sb;
  },
  mode() { return _sbStatus === "connected" ? "shared" : _sbStatus === "unconfigured" ? "unconfigured" : _sbStatus; },

  async getTrack(id) {
    const sb = await this.client();
    if (sb) {
      const { data, error } = await sb.from("order_tracks").select("*").eq("id", id).single();
      if (error && error.code !== "PGRST116") throw error;
      return data || null;
    }
    return lsGet("mk-tracks")[id] || null;
  },

  async setTrack(t) {
    t = plain(t);
    const sb = await this.client();
    if (sb) {
      const { error } = await sb.from("order_tracks").upsert(t, { onConflict: "id" });
      if (error) throw new Error("Could not save tracking data: " + error.message);
      return;
    }
    const m = lsGet("mk-tracks"); m[t.id] = t; lsSet("mk-tracks", m);
  },

  async setOrder(o) {
    o = plain(o);
    const sb = await this.client();
    if (sb) {
      const { error } = await sb.from("commission_requests").upsert(o, { onConflict: "id" });
      if (error) throw new Error("Could not save commission request: " + error.message);
      return;
    }
    const m = lsGet("mk-orders"); m[o.id] = o; lsSet("mk-orders", m);
  },

  async setManage(id, mgmt) {
    mgmt = plain(mgmt);
    const sb = await this.client();
    if (sb) {
      const { error } = await sb.from("commission_management").upsert({ id, ...mgmt }, { onConflict: "id" });
      if (error) throw new Error("Could not save management data: " + error.message);
      return;
    }
    const all = lsGet("mk-manage"); all[id] = mgmt; lsSet("mk-manage", all);
  },

  async allOrders() {
    const sb = await this.client();
    if (sb) {
      const { data: orders, error: oErr } = await sb.from("commission_requests").select("*").order("created_at", { ascending: false });
      if (oErr) throw new Error("Could not load requests: " + oErr.message);
      const { data: mgmt } = await sb.from("commission_management").select("*");
      const mgmtMap = {};
      (mgmt || []).forEach((m) => { mgmtMap[m.id] = m; });
      return (orders || []).map((o) => ({ ...o, ...(mgmtMap[o.id] || {}) }));
    }
    const list = Object.values(lsGet("mk-orders"));
    const man = lsGet("mk-manage");
    return list.map((o) => ({ ...o, ...(man[o.id] || {}) }));
  },

  async uploadReference(file, orderId) {
    const sb = await this.client();
    if (sb) {
      const up = await Store.api("upload", { type: file.type, size: file.size });
      const { error } = await sb.storage.from("references").uploadToSignedUrl(up.path, up.token, file);
      if (error) throw new Error(error.message);
      return { id: uid("ref"), name: file.name, size: file.size, type: file.type, url: URL.createObjectURL(file), path: up.path }; /* url is local preview only; server stores path */
    }
    // fallback: use existing assets capability
    const as = await cap("assets");
    if (!as) throw new Error("File upload is not available. Please configure Supabase or use reference links.");
    const r = await as.upload(file);
    return { id: r.id, name: file.name, size: file.size, type: file.type, url: "/_blob/" + r.id };
  },

  async api(action, body, asOwner) {
    const cfg = getSbCfg(); if (!cfg || !cfg.url) throw new Error("Database is not configured.");
    let tok = cfg.anonKey; if (asOwner) { tok = await Auth.token(); if (!tok) throw new Error("Your session has expired. Please sign in again."); }
    const r = await fetch(cfg.url.replace(/\/$/, "") + "/functions/v1/commission-api", { method: "POST", headers: { "Content-Type": "application/json", apikey: cfg.anonKey, Authorization: "Bearer " + tok }, body: JSON.stringify({ action, ...body }) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Request failed (" + r.status + ")"); return j;
  },
  async submit(order, track) { return (await this.api("submit", { order, track })).track; },
  async lookup(id, email) {
    if (!(await this.client())) { const tr = await this.getTrack(id); return tr && tr.emailHash === (await sha(email.toLowerCase() + "|" + id)) ? tr : null; }
    try {
      const result = await this.api("track", { id, email });
      return result.track ? { ...result.track, reviewSubmitted: Boolean(result.reviewSubmitted) } : null;
    } catch (e) { if (/no order/i.test(e.message)) return null; throw e; }
  },
  async respond(id, email, response, text) { return (await this.api("respond", { id, email, response, text })).track; },
  async create(f, s, c) {
    const sb = await this.client();
    if (!sb && _sbStatus !== "unconfigured") throw new Error("Could not connect to the database. Please check your Supabase configuration.");
    const yr = new Date().getFullYear();
    // Shared mode receives an atomic global sequence from Supabase.
    // Local demo mode keeps a separate sequence in this browser only.
    const seqKey = "mk-commission-seq-" + yr;
    const localSeq = Number(localStorage.getItem(seqKey) || 0) + 1;
    if (!sb) localStorage.setItem(seqKey, String(localSeq));
    const id = sb ? "PENDING" : "COMMISSION-" + yr + "-" + String(localSeq).padStart(4, "0");
    const now = new Date().toISOString();
    const tier = X(s).tiers.find((t) => t.id === f.tier);
    const est = { lines: c.lines, licenseLabel: c.lic ? c.lic.label : "", licenseAmount: c.lv, licenseCustom: c.lc, total: c.total, custom: c.custom };
    const order = { id, created_at: now, createdAt: now, status: "Pending Review", payment: "Unpaid", serviceId: s.id, serviceTitle: s.title, tierName: tier ? tier.name : "", form: f, estimate: est, notes: "", finalPrice: null, extraLines: "" };
    const track = { id, createdAt: now, created_at: now, serviceTitle: s.title, status: "Pending Review", payment: "Unpaid", estimate: est.total, custom: c.custom, emailHash: await sha(f.email.trim().toLowerCase() + "|" + id), proposal: null, updates: [], finalFiles: [] };
    // 1. Save to DB first — commission is never lost even if email fails
    if (sb) return await Store.submit(order, track);
    await Store.setOrder(order);
    await Store.setTrack(track);
    return track;
  },

};

// Connection status hook
function useConnectionStatus() {
  const [status, setStatus] = useState(_sbStatus);
  useEffect(() => {
    let alive = true;
    loadSupabaseClient().then(() => { if (alive) setStatus(_sbStatus); }).catch(() => { if (alive) setStatus("error"); });
    return () => { alive = false; };
  }, []);
  const refresh = () => setStatus(_sbStatus);
  return [status, refresh];
}

        <div className="kv" style={{ marginTop: 12 }}><div className="kv-row"><Icon name="user" /><div><span>Client</span>{f.name} ({f.username || "no username"})</div></div><div className="kv-row"><Icon name="mail" /><div><span>Email (private)</span>{f.email}</div></div><div className="kv-row"><Icon name="globe" /><div><span>Links</span>{[f.ig, f.x, f.tt, f.yt, f.other].filter(Boolean).join(", ") || "None"}</div></div></div></section>
      <section className="card"><h3 style={{ marginBottom: 8 }}>Request</h3><p><b>Type:</b> {d.tierName}, {f.chars} character(s), background: {f.bg || "-"}</p><p><b>Character:</b> {f.cname || "-"}</p><p style={{ whiteSpace: "pre-line" }}><b>Lore:</b> {f.lore || "-"}</p><p style={{ whiteSpace: "pre-line" }}><b>Personality:</b> {f.pers || "-"}</p><p><b>Pose / mood / style:</b> {f.pose || "-"} / {f.mood || "-"} / {f.style || "-"}</p><p style={{ whiteSpace: "pre-line" }}><b>Details:</b> {f.extra || "-"}</p><p><b>License:</b> {E.licenseLabel}</p><p><b>Deadline:</b> {f.deadline || "None"} (rush: {f.rush}). <b>Platform:</b> {f.platform || "-"} {f.commNote}</p><p><b>Public display:</b> {f.display}</p><p style={{ whiteSpace: "pre-line" }}><b>Notes from client:</b> {f.more || "-"}</p>
        <h3 style={{ margin: "12px 0 6px" }}>References</h3>{f.urls && <p style={{ whiteSpace: "pre-line", overflowWrap: "anywhere" }}>{f.urls}</p>}<div className="strip">{f.files.map((fl) => <div key={fl.id}>{fl.type.startsWith("image/") ? <div className="art sq"><img src={fl.url} alt="" /></div> : null}<a href={fl.url} download={fl.name} style={{ overflowWrap: "anywhere" }}>Download {fl.name}</a></div>)}</div>
        <h3 style={{ margin: "12px 0 6px" }}>Client estimate: {idr(E.total)}{E.custom ? " + custom" : ""}</h3>{E.lines.map((l, i) => <div key={i} className="srow"><span>{l[0]}</span><b>{l[2] || idr(l[1])}</b></div>)}</section>
      <section className="card"><h3 style={{ marginBottom: 10 }}>Manage</h3><div className="form">
        <Field label="Order status"><select className="in" value={d.status} onChange={(e) => set("status")(e.target.value)}>{ORDER_STATUS.map((s) => <option key={s}>{s}</option>)}</select></Field>
        <Field label="Payment status (separate)"><select className="in" value={d.payment} onChange={(e) => set("payment")(e.target.value)}>{PAY_STATUS.map((s) => <option key={s}>{s}</option>)}</select></Field>
        <TextIn label="Internal notes (never shown to client)" value={d.notes} onChange={set("notes")} multiline className="full" />
        <TextIn label="Final price (IDR)" value={d.finalPrice == null ? "" : String(d.finalPrice)} onChange={set("finalPrice")} />
        <TextIn label="Custom add-ons (one per line: name | amount)" value={d.extraLines} onChange={set("extraLines")} multiline className="full" />
        <TextIn label="Estimated delivery" value={pr.delivery} onChange={(v) => setPr({ ...pr, delivery: v })} /><TextIn label="Revision policy" value={pr.revision} onChange={(v) => setPr({ ...pr, revision: v })} />
        <TextIn label="Proposal notes" value={pr.notes} onChange={(v) => setPr({ ...pr, notes: v })} multiline className="full" /><TextIn label="Payment instructions" value={pr.paymentInfo} onChange={(v) => setPr({ ...pr, paymentInfo: v })} multiline className="full" /></div>
        <div className="btns" style={{ marginTop: 12 }}><Btn kind="cyan" onClick={() => save()}>Save changes</Btn><Btn onClick={sendProposal} disabled={!d.finalPrice}>Send proposal to client</Btn></div>
        <div className="pwrow" style={{ marginTop: 14 }}><input className="in" value={pub} onChange={(e) => setPub(e.target.value)} placeholder="Progress update visible to the client" /><Btn kind="cyan" size="sm" onClick={post}>Post update</Btn></div>
        <div style={{ marginTop: 12 }}><small className="muted">Upload final file for the client</small><input type="file" className="in" onChange={finalUp} /></div>
        {msg && <div className="note info" style={{ marginTop: 12 }}>{msg}</div>}
        {t && t.proposal && <p className="muted" style={{ marginTop: 10 }}>Proposal response: {t.proposal.response || "waiting"}</p>}{t && t.updates.filter((u) => u.from === "client").map((u, i) => <p key={i} className="note info" style={{ marginTop: 6 }}>{u.text}</p>)}</section>
    </div>
  );
}
function NotifPanel() {
  const [rows, setRows] = useState(null); const [msg, setMsg] = useState(null); const [busy, setBusy] = useState("");
  const load = async () => {
    try {
      const sb = await Store.client(); if (!sb) { setRows([]); return; }
      const { data, error } = await sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(30);
      if (error) throw error; setRows(data || []);
    } catch (e) { setMsg({ err: "Could not load notification history: " + authErr(e) }); setRows([]); }
  };
  useEffect(() => { load(); }, []);
  const failedIds = [...new Set((rows || []).filter((r) => r.status === "failed" && r.kind !== "test").map((r) => r.order_id))];
  const retry = async (ids) => {
    setBusy("retry"); setMsg(null); let bad = 0;
    try {
      for (const id of ids) { const r = await Store.api("retry", { id }, true); bad += (r.notifications || []).filter((n) => n.status !== "sent").length; }
      setMsg(bad ? { err: bad + " notification(s) still failed. See the error details below." } : { ok: "Google Apps Script accepted every retried email. This confirms sending, not inbox delivery." });
    } catch (e) { setMsg({ err: authErr(e) }); }
    setBusy(""); load();
  };
  const test = async () => {
    setBusy("test"); setMsg(null);
    try { const r = await Store.api("test", {}, true); setMsg(r.status === "sent" ? { ok: "Google Apps Script accepted the test email. Check your inbox to confirm it arrived." } : { err: "The test email failed. See the history below." }); }
    catch (e) { setMsg({ err: authErr(e) }); }
    setBusy(""); load();
  };
  return (
    <section className="card" style={{ marginBottom: 18 }}>
      <div className="card-head"><h2>Email notifications {failedIds.length > 0 && <span className="tag" style={{ color: "var(--bad)" }}>{failedIds.length} failed</span>}</h2>
        <div className="btns"><Btn kind="ghost" size="sm" disabled={!!busy} onClick={test}>{busy === "test" ? "Sending..." : "Send test email"}</Btn>
          <Btn kind="cyan" size="sm" disabled={!!busy || !failedIds.length} onClick={() => retry(failedIds)}>{busy === "retry" ? "Retrying..." : "Retry failed (" + failedIds.length + ")"}</Btn></div></div>
      {msg && <div className={"note " + (msg.err ? "bad" : "ok")} role="status" style={{ marginBottom: 10 }}>{msg.err || msg.ok}</div>}
      {rows === null ? <p className="muted">Loading...</p> : rows.length === 0 ? <p className="muted">No notifications recorded yet.</p> :
        <div className="list">{rows.map((r) => <div key={r.id} className="rowi"><div className="grow"><b>{r.order_id}</b> <span className="tag">{r.kind}</span> <span className="tag" style={{ color: r.status === "sent" ? "var(--ok)" : r.status === "failed" ? "var(--bad)" : "var(--warn)" }}>{r.status === "sent" ? "accepted by Gmail" : r.status}</span>
          <small className="muted" style={{ display: "block" }}>Attempts: {r.attempts}{r.sent_at ? " · " + new Date(r.sent_at).toLocaleString() : ""}{r.message ? " · " + r.message : ""}</small></div>
          {r.status === "failed" && r.kind !== "test" && <Btn kind="ghost" size="sm" disabled={!!busy} onClick={() => retry([r.order_id])}>Retry</Btn>}</div>)}</div>}
    </section>
  );
}

function OrdersPanel() {
  const [list, setList] = useState(null); const [sel, setSel] = useState(null); const [err, setErr] = useState("");
  const [connStatus] = useConnectionStatus();
  const load = () => Store.allOrders().then((a) => setList(a.sort((x, y) => (y.createdAt || y.created_at || "").localeCompare(x.createdAt || x.created_at || "")))).catch((e) => setErr("Could not load requests: " + (e && e.message || "")));
  useEffect(() => {
    load();
    // Subscribe to realtime new commissions if Supabase connected
    let channel = null;
    if (_sbClient) {
      channel = _sbClient.channel("commission_requests_changes")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "commission_requests" }, () => { load(); })
        .subscribe();
    }
    return () => { if (channel) _sbClient && _sbClient.removeChannel(channel); };
  }, [connStatus]);
  if (sel) return <OrderDetail o={sel} onBack={() => { setSel(null); load(); }} onSaved={() => {}} />;
  const n = (st) => (list || []).filter((o) => st.includes(o.status)).length;
  const stats = [["Total", list ? list.length : 0], ["Pending", n(["Pending Review"])], ["Accepted", n(["Paid", "Awaiting Payment"])], ["In progress", n(["In Progress", "Waiting for Feedback", "Revision"])], ["Completed", n(["Completed"])], ["Rejected", n(["Rejected", "Cancelled"])]];
  return (
    <div className="panel"><StoreBanner />{err && <div className="note bad">{err}</div>}<NotifPanel />
      <div className="grid">{stats.map(([l, v]) => <div key={l} className="card stat" style={{ gridColumn: "span 2" }}><span className="lbl">{l}</span><b>{v}</b></div>)}</div>
      <section className="card"><h2 style={{ marginBottom: 12 }}>Client requests</h2>{list === null ? <p className="muted">Loading...</p> : list.length === 0 ? <p className="muted">No requests yet.</p> : <div className="list">{list.map((o) => <button key={o.id} className="rowi" style={{ textAlign: "left", cursor: "pointer", width: "100%" }} onClick={() => setSel(o)}><div className="grow"><b>{o.id} - {o.form.name}</b><small className="muted">{o.form.email} / {o.serviceTitle} / {fmtDate(o.createdAt)} / {idr(o.estimate.total)}</small></div><span className="tag">{o.status}</span></button>)}</div>}</section>
    </div>
  );
}

function ReviewsPanel() {
  const [reviews, setReviews] = useState(null);
  const [message, setMessage] = useState("");
  const [busy, setBusy] = useState("");
  const load = async () => {
    try {
      const result = await Store.api("reviews_admin_list", {}, true);
      setReviews(Array.isArray(result.reviews) ? result.reviews : []);
      setMessage("");
    } catch (error) { setMessage(error.message || "Could not load reviews."); setReviews([]); }
  };
  useEffect(() => { load(); }, []);
  const moderate = async (review, status) => {
    setBusy(review.id); setMessage("");
    try { await Store.api("reviews_admin_update", { id: review.id, status }, true); await load(); }
    catch (error) { setMessage(error.message || "Could not update review."); }
    setBusy("");
  };
  const remove = async (review) => {
    if (!window.confirm("Permanently delete this review?")) return;
    setBusy(review.id); setMessage("");
    try { await Store.api("reviews_admin_delete", { id: review.id }, true); await load(); }
    catch (error) { setMessage(error.message || "Could not delete review."); }
    setBusy("");
  };
  const counts = (status) => (reviews || []).filter((r) => r.status === status).length;
  return <div className="panel">
    <div className="grid">{["pending","approved","hidden"].map((status) => <section className="card stat span-4" key={status}><span className="lbl">{status}</span><b>{counts(status)}</b></section>)}</div>
    {message && <div className="note info">{message}</div>}
    <section className="card">
      <div className="card-head"><h2>Client Reviews</h2><Btn kind="ghost" size="sm" onClick={load} disabled={!!busy}>Refresh</Btn></div>
      <p className="muted" style={{ marginBottom: 12 }}>New reviews stay private until you approve them. Only approved reviews appear on the public homepage.</p>
      {reviews === null ? <p className="muted">Loading reviews...</p> : !reviews.length ? <p className="muted">No reviews submitted yet.</p> :
        <div className="list">{reviews.map((review) => <article className="rowi" key={review.id} style={{ alignItems: "flex-start" }}>
          <div className="grow" style={{ whiteSpace: "normal" }}>
            <div className="meta"><b>{review.display_name}</b><span className="tag">{review.status}</span><span className="tag">{review.rating}/5 ★</span><small className="muted">{review.commission_id} · {fmtDate(review.created_at)}</small></div>
            <p style={{ marginTop: 8, whiteSpace: "pre-wrap" }}>{review.message}</p>
          </div>
          <div className="acts">
            {review.status !== "approved" && <Btn size="sm" kind="cyan" disabled={!!busy} onClick={() => moderate(review,"approved")}>Approve</Btn>}
            {review.status !== "hidden" && <Btn size="sm" kind="ghost" disabled={!!busy} onClick={() => moderate(review,"hidden")}>Hide</Btn>}
            <Btn size="sm" kind="danger" disabled={!!busy} onClick={() => remove(review)}>Delete</Btn>
          </div>
        </article>)}</div>}
    </section>
  </div>;
}

/* ============================================================ app */
function App() {
  const [route, go] = useHashRoute();
  const [saved, setSaved] = useState(loadSaved);
  const [site, setSite] = useState(saved);
  // Load the published site content from Supabase for every visitor.
  useEffect(() => {
    let active = true;
    (async () => {
      try {
        const sb = await loadSupabaseClient();
        if (!sb) return;
        const result = await Store.api("get_site", {});
        if (active && result.site && typeof result.site === "object") {
          const remote = mergeDeep(DEFAULT_SITE, result.site);
          setSaved(remote);
          setSite(remote);
        }
      } catch (error) {
        console.warn("Could not load published site content:", error);
      }
    })();
    return () => { active = false; };
  }, []);

  // Auto-connect to Supabase and sync email config from cloud on mount
  useEffect(() => {
    if (!getSbCfg()) return;
    loadSupabaseClient().then(async (sb) => {
      if (!sb) return;
      const { data } = await sb.from("app_settings").select("value").eq("key", "email_config").single().catch(() => ({ data: null }));
      if (data && data.value) {
        const existing = getEmailCfg() || {};
        setEmailCfgLocal({ ...existing, ...data.value });
      }
    }).catch(() => {});
  }, []);
  CONFIG = site;
  const [query, setQuery] = useState("");
  const [cat, setCat] = useState("all");
  const [openId, setOpenId] = useState(null);
  const [cur, setCur] = useState(saved.defaultCurrency || "IDR");
  const [lang, setLang] = useState("en");
  const [gate, setGate] = useState(false);
  const [auth, setAuth] = useState({ loading: true, owner: false });
  const authRef = useRef(auth); authRef.current = auth;
  const loggingOut = useRef(false);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);
  const [toast, setToast] = useState("");

  useEffect(() => {
    let on = true, sub = null;
    (async () => {
      const r = await Auth.restore(); if (on) setAuth({ loading: false, owner: r.owner });
      const sb = await loadSupabaseClient(); if (!sb || !on) return;
      const { data } = sb.auth.onAuthStateChange((ev) => {
        if (ev === "SIGNED_OUT") { if (authRef.current.owner && !loggingOut.current) setToast("Your session has ended. Please sign in again."); setAuth({ loading: false, owner: false }); }
      });
      sub = data.subscription;
    })();
    return () => { on = false; sub && sub.unsubscribe(); };
  }, []);
  const [, setDbv] = useState(0);
  useEffect(() => { let on = true; (async () => { const d = await cap("db"); if (on && d) { DB = d; setDbv(1); } })(); return () => { on = false; }; }, []);
  const creatorOn = auth.owner;
  useEffect(() => {
    if (route === "creator" && !auth.loading && !creatorOn) { go("home"); setToast("That area is restricted. Please sign in."); }
  }, [route, auth.loading, creatorOn]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2600); return () => clearTimeout(t); }, [toast]);

  useEffect(() => {
    const c = (site.appearance.accent || "#B9D8F7"), r = document.documentElement.style;
    r.setProperty("--cyan", c); r.setProperty("--on-accent", hexLum(c) > 0.35 ? "#1E3640" : "#FFFFFF");
  }, [site.appearance.accent]);

  const step = useCallback((d) => setOpenId((id) => {
    const i = CONFIG.artworks.findIndex((a) => a.id === id);
    if (!CONFIG.artworks.length) return null;
    return CONFIG.artworks[(i + d + CONFIG.artworks.length) % CONFIG.artworks.length].id;
  }), []);
  const close = useCallback(() => setOpenId(null), []);

  const upd = useCallback((mut) => setSite((p) => { const n = clone(p); mut(n); return n; }), []);
  const dirty = useMemo(() => JSON.stringify(site) !== JSON.stringify(saved), [site, saved]);
  const doPublish = async (data) => {
    setSaving(true); setMsg(null);
    try {
      await publishSite(data);
      const next = clone(data);
      setSaved(next);
      setSite(next);
      setMsg({ ok: "Saved. Visitors will see the update." });
    } catch (e) { setMsg({ err: authErr(e) || explain(e) }); }
    setSaving(false);
  };
  const save = () => doPublish(site);
  const savePart = (path) => { const base = clone(saved); setPath(base, path, clone(getPath(site, path))); return doPublish(base); };
  const discard = () => { setSite(saved); setMsg(null); };
  const exit = async () => { loggingOut.current = true; await Auth.signOut(); ss.del("mk-tab"); setAuth({ loading: false, owner: false }); setSite(saved); setMsg(null); go("home"); setToast("You have been signed out."); loggingOut.current = false; };

  const openGate = () => { if (creatorOn) { go("creator"); return; } setGate(true); };
  const onGateOk = async (email, pw) => {
    try { await Auth.signIn(email, pw); } catch (e) { return (e && e.message) || "Sign-in failed."; }
    setAuth({ loading: false, owner: true }); setGate(false); go("creator"); return "";
  };

  const view = route === "creator" && !creatorOn ? "home" : route;
  return (
    <CreatorCtx.Provider value={{ site, upd, saved, dirty, saving, save, savePart, discard, exit, msg }}>
      <div className="shell">
        <Sidebar route={view} go={go} openGate={openGate} creatorOn={creatorOn} />
        <MobileChrome route={view} go={go} openGate={openGate} creatorOn={creatorOn} />
        <main className="main">
          <TopBar route={view} go={go} query={query} setQuery={(v) => { setQuery(v); if (v) setCat("all"); }} />
          {creatorOn && <div style={{ padding: "10px 24px 0" }}><CreatorBar go={go} /></div>}
          <div className="main-inner" key={view}>
            {view === "home" && <Home go={go} open={setOpenId} />}
            {view === "about" && <About />}
            {view === "gallery" && <Gallery query={query} setQuery={setQuery} cat={cat} setCat={setCat} open={setOpenId} />}
            {view === "commission" && <Commission go={go} cur={cur} setCur={setCur} />}
            {view === "services" && <Services go={go} setCat={setCat} />}
            {view === "board" && <CommissionBoard />}
            {view === "terms" && <Terms lang={lang} setLang={setLang} go={go} />}
            {view === "workflow" && <Workflow go={go} />}
            {view === "contact" && <Contact />}
            {view === "track" && <Track />}
            {view.startsWith("service-") && <ServiceDetail id={view.slice(8)} go={go} />}
            {view.startsWith("order-") && <OrderFlow id={view.slice(6)} go={go} />}
            {view === "creator" && creatorOn && <CreatorPage />}
          </div>
        </main>
        {openId && <Lightbox id={openId} close={close} step={step} />}
        {gate && <AccessModal onClose={() => setGate(false)} onSuccess={onGateOk} />}
        {toast && <div className="toast" role="status">{toast}</div>}
      </div>
    </CreatorCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
